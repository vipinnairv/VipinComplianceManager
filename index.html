<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Vipin's Tax & Compliance Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet"/>
<style>
/* ── THEME VARIABLES ── */
:root {
  --primary:#FF6B35; --primary-light:#FF8C5A; --secondary:#7C3AED;
  --accent:#10B981; --accent2:#F59E0B; --accent3:#EF4444;
  --dark:#0F0F1A; --dark2:#1A1A2E; --dark3:#16213E;
  --card:#1E1E35; --card2:#252540; --border:rgba(255,255,255,0.08);
  --text:#F0F0FF; --text2:#A0A0C0; --text3:#6060A0;
  --gst:#10B981; --tds:#6366F1; --pf:#F59E0B; --pt:#EC4899;
  --esic:#14B8A6; --it:#F97316; --mca:#8B5CF6; --fcra:#06B6D4; --sebi:#A78BFA;
  --shadow:0 4px 20px rgba(0,0,0,0.4);
}
body.light {
  --dark:#F5F5FF; --dark2:#EEEEFF; --dark3:#E8E8FF;
  --card:#FFFFFF; --card2:#F0F0FA; --border:rgba(0,0,0,0.1);
  --text:#1A1A2E; --text2:#4A4A6A; --text3:#8A8AAA;
  --shadow:0 4px 20px rgba(0,0,0,0.1);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Outfit',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background 0.3s,color 0.3s;}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--dark2)}
::-webkit-scrollbar-thumb{background:var(--secondary);border-radius:3px}

/* LAYOUT */
.app-layout{display:flex;min-height:100vh;}
.sidebar{width:256px;min-width:256px;background:var(--dark2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;left:0;top:0;height:100vh;z-index:100;overflow-y:auto;transition:transform 0.3s;}
.main-content{margin-left:256px;flex:1;min-height:100vh;}

/* BRAND */
.brand{padding:20px 18px 14px;border-bottom:1px solid var(--border);}
.brand-logo{width:42px;height:42px;background:linear-gradient(135deg,var(--primary),var(--secondary));border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:9px;box-shadow:0 4px 14px rgba(255,107,53,0.35);}
.brand-name{font-family:'Playfair Display',serif;font-size:14px;font-weight:700;color:var(--text);line-height:1.25;}
.brand-tagline{font-size:9.5px;color:var(--text3);margin-top:2px;letter-spacing:.6px;text-transform:uppercase;}

/* NAV */
.nav-section{padding:10px 10px;}
.nav-label{font-size:9.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--text3);padding:7px 8px 3px;font-weight:700;}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:10px;cursor:pointer;transition:all .2s;margin-bottom:1px;font-size:13px;color:var(--text2);font-weight:500;border:1px solid transparent;}
.nav-item:hover{background:rgba(255,107,53,0.09);color:var(--text);}
.nav-item.active{background:linear-gradient(135deg,rgba(255,107,53,0.18),rgba(124,58,237,0.18));color:var(--primary);border-color:rgba(255,107,53,0.18);}
.nav-icon{width:27px;height:27px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;background:rgba(255,255,255,0.06);flex-shrink:0;}
.nav-item.active .nav-icon{background:var(--primary);}
.nav-badge{margin-left:auto;background:var(--accent3);color:#fff;font-size:9.5px;padding:1px 6px;border-radius:10px;font-weight:700;}

/* SIDEBAR PROFILE */
.sidebar-profile{margin:auto 10px 10px;background:var(--card);border-radius:11px;padding:11px 12px;border:1px solid var(--border);cursor:pointer;transition:all .2s;}
.sidebar-profile:hover{border-color:var(--primary);}
.profile-entity-badge{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:20px;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px;}
.profile-name{font-size:12.5px;font-weight:700;color:var(--text);}
.profile-pan{font-size:10.5px;color:var(--text2);margin-top:1px;}

/* TOPBAR */
.topbar{background:var(--dark2);border-bottom:1px solid var(--border);padding:11px 26px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.topbar-title{font-size:19px;font-weight:800;color:var(--text);}
.topbar-subtitle{font-size:11.5px;color:var(--text2);margin-top:1px;}
.fy-badge{background:linear-gradient(135deg,var(--secondary),var(--primary));color:#fff;padding:5px 13px;border-radius:20px;font-size:11.5px;font-weight:700;}
.topbar-actions{display:flex;gap:8px;align-items:center;}

/* BUTTONS */
.btn{padding:7px 15px;border-radius:8px;border:none;cursor:pointer;font-family:'Outfit',sans-serif;font-weight:600;font-size:12.5px;transition:all .2s;display:flex;align-items:center;gap:5px;}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(255,107,53,.4);}
.btn-secondary{background:var(--card);color:var(--text);border:1px solid var(--border);}
.btn-secondary:hover{border-color:var(--primary);color:var(--primary);}
.btn-ghost{background:transparent;color:var(--text2);}
.btn-ghost:hover{color:var(--text);background:rgba(255,255,255,.05);}
.btn-danger{background:rgba(239,68,68,.14);color:var(--accent3);border:1px solid rgba(239,68,68,.28);}
.btn-danger:hover{background:rgba(239,68,68,.22);}
.btn-success{background:rgba(16,185,129,.14);color:var(--accent);border:1px solid rgba(16,185,129,.28);}
.btn-success:hover{background:rgba(16,185,129,.22);}
.btn-gcal{background:linear-gradient(135deg,#4285F4,#34A853);color:#fff;}
.btn-gcal:hover{transform:translateY(-1px);box-shadow:0 3px 12px rgba(66,133,244,.4);}
.btn-sm{padding:4px 11px;font-size:11.5px;}

/* PAGE */
.page{padding:22px 26px;}

/* CARDS */
.card{background:var(--card);border-radius:16px;border:1px solid var(--border);padding:18px 20px;box-shadow:var(--shadow);}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px;}
.card-title{font-size:14.5px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:7px;}
.card-subtitle{font-size:11.5px;color:var(--text2);margin-top:2px;}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px;}

/* SECTION GRIDS */
.section-grid{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-bottom:20px;}

/* CALENDAR */
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-day-header{text-align:center;font-size:10.5px;font-weight:700;color:var(--text3);padding:5px 0;text-transform:uppercase;}
.cal-day{min-height:86px;background:var(--card2);border-radius:9px;padding:5px;border:1px solid transparent;transition:all .2s;cursor:pointer;position:relative;}
.cal-day:hover{border-color:var(--primary);}
.cal-day.today{border-color:var(--primary);background:rgba(255,107,53,.07);}
.cal-day.today .day-num{background:var(--primary);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;}
.cal-day.other-month{opacity:.28;}
.day-num{font-size:12.5px;font-weight:600;color:var(--text);margin-bottom:3px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;}
.cal-event{font-size:8.5px;padding:2px 4px;border-radius:3px;margin-bottom:2px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4;}
.cal-more{font-size:8.5px;color:var(--text2);padding:1px 3px;}

/* TASK ITEMS */
.task-item{display:flex;align-items:flex-start;gap:11px;padding:12px 14px;border-radius:11px;background:var(--card2);margin-bottom:7px;border:1px solid var(--border);transition:all .2s;cursor:pointer;}
.task-item:hover{border-color:rgba(255,255,255,.14);}
.task-item.done{opacity:.55;}
.task-checkbox{width:17px;height:17px;border-radius:5px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all .2s;}
.task-checkbox.checked{background:var(--accent);border-color:var(--accent);}
.task-name{font-size:12.5px;font-weight:600;color:var(--text);}
.task-meta{font-size:10.5px;color:var(--text2);margin-top:2px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.due-badge{font-size:9.5px;padding:2px 7px;border-radius:9px;font-weight:700;white-space:nowrap;}
.due-overdue{background:rgba(239,68,68,.2);color:var(--accent3);}
.due-today{background:rgba(245,158,11,.2);color:var(--accent2);}
.due-soon{background:rgba(16,185,129,.14);color:var(--accent);}
.due-upcoming{background:rgba(255,255,255,.06);color:var(--text2);}

/* FORMS */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-group{display:flex;flex-direction:column;gap:5px;}
.form-group.full{grid-column:1/-1;}
label{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;}
input,select,textarea{background:var(--dark2);border:1px solid var(--border);color:var(--text);padding:9px 13px;border-radius:9px;font-family:'Outfit',sans-serif;font-size:12.5px;transition:all .2s;outline:none;width:100%;}
input:focus,select:focus,textarea:focus{border-color:var(--primary);background:rgba(255,107,53,.04);}
select option{background:var(--dark2);}

/* TABS */
.tabs{display:flex;gap:3px;background:var(--dark2);padding:3px;border-radius:11px;margin-bottom:18px;}
.tab{padding:7px 15px;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--text2);transition:all .2s;}
.tab.active{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;}
.tab:hover:not(.active){color:var(--text);background:rgba(255,255,255,.05);}

/* PROGRESS */
.progress-bar{height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;border-radius:3px;transition:width .5s ease;}

/* ALERTS */
.alert{padding:11px 15px;border-radius:9px;font-size:12.5px;margin-bottom:11px;display:flex;align-items:flex-start;gap:9px;}
.alert-warning{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.25);color:var(--accent2);}
.alert-danger{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:var(--accent3);}
.alert-info{background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.25);color:#818CF8;}
.alert-success{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.25);color:var(--accent);}

/* ENTITY GRID */
.entity-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;}
.entity-card{padding:14px;border-radius:13px;border:2px solid var(--border);cursor:pointer;text-align:center;transition:all .2s;background:var(--card2);}
.entity-card:hover{border-color:var(--primary);transform:translateY(-2px);}
.entity-card.selected{border-color:var(--primary);background:rgba(255,107,53,.08);}
.entity-icon{font-size:26px;margin-bottom:7px;}
.entity-name{font-size:11.5px;font-weight:700;color:var(--text);}
.entity-desc{font-size:9.5px;color:var(--text2);margin-top:3px;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(5px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--dark2);border:1px solid var(--border);border-radius:19px;width:100%;max-width:580px;max-height:90vh;overflow-y:auto;}
.modal-header{padding:18px 22px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;position:sticky;top:0;background:var(--dark2);z-index:1;}
.modal-title{font-size:17px;font-weight:800;}
.modal-body{padding:18px 22px;}
.modal-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:9px;}
.close-btn{background:none;border:none;color:var(--text2);cursor:pointer;font-size:18px;width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;}
.close-btn:hover{background:rgba(255,255,255,.08);color:var(--text);}

/* CAT LABEL */
.cat-label{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:5px;font-size:10.5px;font-weight:700;}

/* FILTER */
.filter-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.filter-pill{padding:4px 13px;border-radius:20px;font-size:11.5px;font-weight:600;cursor:pointer;border:1px solid var(--border);color:var(--text2);transition:all .2s;}
.filter-pill.active{border-color:var(--primary);color:var(--primary);background:rgba(255,107,53,.1);}
.filter-pill:hover:not(.active){border-color:rgba(255,255,255,.18);color:var(--text);}

/* MONTH NAV */
.month-nav{display:flex;align-items:center;gap:10px;}
.month-nav-btn{background:var(--card2);border:1px solid var(--border);color:var(--text);width:32px;height:32px;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .2s;}
.month-nav-btn:hover{border-color:var(--primary);color:var(--primary);}
.month-name{font-size:16px;font-weight:800;min-width:170px;text-align:center;}

/* SEARCH */
.search-bar{position:relative;}
.search-bar input{padding-left:34px;}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px;}

/* DROP ZONE */
.drop-zone{border:2px dashed var(--border);border-radius:13px;padding:28px;text-align:center;cursor:pointer;transition:all .2s;}
.drop-zone:hover{border-color:var(--primary);background:rgba(255,107,53,.04);}

/* SUMMARY ROW */
.summary-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);}
.summary-row:last-child{border-bottom:none;}

/* ONBOARDING */
.onboard-hero{text-align:center;padding:50px 36px 24px;}
.onboard-logo{width:76px;height:76px;background:linear-gradient(135deg,var(--primary),var(--secondary));border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 18px;box-shadow:0 8px 28px rgba(255,107,53,.4);}
.onboard-title{font-family:'Playfair Display',serif;font-size:32px;font-weight:800;margin-bottom:10px;background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.onboard-sub{font-size:14px;color:var(--text2);max-width:460px;margin:0 auto 28px;line-height:1.65;}

/* PASSWORD PAGE */
.pwd-card{background:var(--card);border-radius:14px;border:1px solid var(--border);overflow:hidden;margin-bottom:14px;}
.pwd-header{padding:13px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
.pwd-body{padding:14px 16px;}
.pwd-field{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);}
.pwd-field:last-child{border-bottom:none;}
.pwd-label{font-size:10.5px;color:var(--text3);font-weight:600;text-transform:uppercase;min-width:70px;}
.pwd-val{font-size:12.5px;color:var(--text);font-weight:600;flex:1;font-family:monospace;letter-spacing:.3px;}
.pwd-eye{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;padding:3px 6px;border-radius:5px;transition:all .2s;}
.pwd-eye:hover{color:var(--text);background:rgba(255,255,255,.07);}
.copy-btn{background:rgba(255,255,255,.06);border:none;color:var(--text2);cursor:pointer;font-size:11px;padding:3px 8px;border-radius:5px;transition:all .2s;font-family:'Outfit',sans-serif;}
.copy-btn:hover{background:rgba(255,107,53,.15);color:var(--primary);}

/* THEME TOGGLE */
.theme-toggle{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:4px;display:flex;gap:2px;cursor:pointer;}
.theme-btn{width:28px;height:28px;border-radius:16px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .2s;background:transparent;color:var(--text2);}
.theme-btn.active{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;}

/* GRADIENT LINE */
.gradient-line{height:3px;background:linear-gradient(90deg,var(--primary),var(--secondary),var(--accent));border-radius:2px;}

/* DIVIDER */
.divider{height:1px;background:var(--border);margin:14px 0;}

/* PENALTY BOX */
.penalty-box{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:9px;padding:9px 13px;font-size:11.5px;color:#FCA5A5;}

/* ANIMATIONS */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.fade-in{animation:fadeIn .28s ease;}

/* RESPONSIVE */
@media(max-width:900px){
  .sidebar{transform:translateX(-100%);}
  .main-content{margin-left:0;}
  .form-grid{grid-template-columns:1fr;}
  .section-grid{grid-template-columns:1fr;}
  .entity-grid{grid-template-columns:repeat(2,1fr);}
}
</style>

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useMemo, useRef } = React;

// ─── STORAGE VERSION (bump this to force reset old cached data) ────────────
const STORAGE_VERSION = '3';

function savePersist(key, val) {
  try { localStorage.setItem('vtcp3_' + key, JSON.stringify(val)); } catch(e) {}
}
function loadPersist(key, def) {
  try {
    const v = localStorage.getItem('vtcp3_' + key);
    return v !== null ? JSON.parse(v) : def;
  } catch(e) { return def; }
}

// ─── AI CLIENT (Groq / Gemini / Claude) ─────────────────────────────────────
const AI_MODELS = {
  groq:   { label:'Groq (Llama 3.3 70B)', model:'llama-3.3-70b-versatile', keyHint:'gsk_...' },
  gemini: { label:'Google Gemini 1.5 Flash', model:'gemini-1.5-flash',     keyHint:'AIza...' },
  claude: { label:'Anthropic Claude Haiku 4.5', model:'claude-haiku-4-5-20251001', keyHint:'sk-ant-...' },
};
const AI_SYSTEM = "You are an expert Indian tax & compliance advisor. Give concise, actionable, India-specific guidance for FY 2025-26/2026-27. Use bullet points. Always remind the user to verify with their CA/CS before acting. No markdown code fences. Max ~180 words.";

async function aiGenerate({ provider, apiKey, prompt }) {
  if (!apiKey) throw new Error('API key not set for ' + provider);
  const model = AI_MODELS[provider].model;
  if (provider === 'groq') {
    const r = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':`Bearer ${apiKey}` },
      body: JSON.stringify({ model, temperature:0.3, max_tokens:400, messages:[{role:'system',content:AI_SYSTEM},{role:'user',content:prompt}] })
    });
    const j = await r.json(); if (!r.ok) throw new Error(j?.error?.message || 'Groq error');
    return j.choices[0].message.content.trim();
  }
  if (provider === 'gemini') {
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`, {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ systemInstruction:{ parts:[{ text:AI_SYSTEM }] }, contents:[{ role:'user', parts:[{ text: prompt }] }], generationConfig:{ temperature:0.3, maxOutputTokens:500 } })
    });
    const j = await r.json(); if (!r.ok) throw new Error(j?.error?.message || 'Gemini error');
    return (j.candidates?.[0]?.content?.parts?.[0]?.text || '').trim();
  }
  if (provider === 'claude') {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'x-api-key':apiKey, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
      body: JSON.stringify({ model, max_tokens:500, system:AI_SYSTEM, messages:[{role:'user',content:prompt}] })
    });
    const j = await r.json(); if (!r.ok) throw new Error(j?.error?.message || 'Claude error');
    return (j.content?.[0]?.text || '').trim();
  }
  throw new Error('Unknown provider: ' + provider);
}

// ─── GOOGLE DRIVE SYNC ──────────────────────────────────────────────────────
const DRIVE_FILE_NAME = 'TaxCompliancePro.json';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const driveSync = {
  tokenClient: null,
  accessToken: null,
  fileId: null,
  gapiReady: false,
  async _loadGapi() {
    if (this.gapiReady) return;
    await new Promise((resolve, reject) => {
      const check = () => {
        if (window.gapi) {
          window.gapi.load('client', async () => {
            try {
              await window.gapi.client.init({ discoveryDocs:['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'] });
              this.gapiReady = true; resolve();
            } catch(e){ reject(e); }
          });
        } else setTimeout(check, 150);
      };
      check();
    });
  },
  async signIn(clientId) {
    if (!clientId) throw new Error('Missing Google Client ID');
    await this._loadGapi();
    await new Promise((resolve, reject) => {
      const check = () => { if (window.google && window.google.accounts) resolve(); else setTimeout(check,150); };
      check();
    });
    return new Promise((resolve, reject) => {
      this.tokenClient = window.google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: DRIVE_SCOPE,
        callback: async (resp) => {
          if (resp.error) { reject(resp); return; }
          this.accessToken = resp.access_token;
          window.gapi.client.setToken({ access_token: resp.access_token });
          try {
            const info = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers:{ Authorization:`Bearer ${resp.access_token}` } }).then(r=>r.json()).catch(()=>({}));
            resolve({ email: info.email || 'Google User', name: info.name || '', picture: info.picture || '' });
          } catch(e){ resolve({ email:'Google User' }); }
        },
      });
      this.tokenClient.requestAccessToken({ prompt: 'consent' });
    });
  },
  signOut() {
    if (this.accessToken && window.google?.accounts?.oauth2) {
      try { window.google.accounts.oauth2.revoke(this.accessToken, ()=>{}); } catch(e){}
    }
    this.accessToken = null; this.fileId = null;
    if (window.gapi?.client) window.gapi.client.setToken(null);
  },
  async _findFile() {
    const res = await window.gapi.client.drive.files.list({ q:`name='${DRIVE_FILE_NAME}' and trashed=false`, spaces:'drive', fields:'files(id,name,modifiedTime)' });
    return res.result.files && res.result.files[0] ? res.result.files[0] : null;
  },
  async pushState(payload) {
    await this._loadGapi();
    const body = JSON.stringify({ ...payload, updatedAt: new Date().toISOString() }, null, 2);
    const boundary = '-------vtcp' + Date.now();
    const delim = `\r\n--${boundary}\r\n`;
    const close = `\r\n--${boundary}--`;
    let existing = this.fileId;
    if (!existing) { const f = await this._findFile(); existing = f ? f.id : null; }
    const meta = { name: DRIVE_FILE_NAME, mimeType:'application/json' };
    const multipart = delim + 'Content-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(meta) + delim + 'Content-Type: application/json\r\n\r\n' + body + close;
    const path = existing ? `/upload/drive/v3/files/${existing}?uploadType=multipart` : '/upload/drive/v3/files?uploadType=multipart';
    const method = existing ? 'PATCH' : 'POST';
    const res = await window.gapi.client.request({ path, method, headers:{ 'Content-Type':`multipart/related; boundary="${boundary}"` }, body: multipart });
    this.fileId = res.result.id || existing;
    return res.result;
  },
  async pullState() {
    await this._loadGapi();
    const f = await this._findFile();
    if (!f) return null;
    this.fileId = f.id;
    const res = await window.gapi.client.drive.files.get({ fileId: f.id, alt:'media' });
    try { return typeof res.body === 'string' ? JSON.parse(res.body) : res.result; } catch(e){ return null; }
  },
};

// ─── HELPERS ─────────────────────────────────────────────────────────────────

const today = () => new Date();

function getDueDays(dueStr) {
  const due = new Date(dueStr); const now = today();
  now.setHours(0,0,0,0); due.setHours(0,0,0,0);
  return Math.round((due - now) / 86400000);
}
function getDueStatus(dueStr) {
  const d = getDueDays(dueStr);
  if (d < 0) return 'overdue'; if (d === 0) return 'today'; if (d <= 7) return 'soon'; return 'upcoming';
}
function getCatInfo(catId) { return COMP_CATEGORIES.find(c => c.id === catId) || { label:catId, color:'#fff', bg:'rgba(255,255,255,.1)' }; }
function formatDate(s) {
  if (!s) return '—';
  return new Date(s).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
}
function toGCalDate(s) {
  if (!s) return '';
  return s.replace(/-/g,'') + 'T000000Z';
}
function openGCal(task) {
  const start = toGCalDate(task.due);
  const end = toGCalDate(task.due);
  const title = encodeURIComponent(`[Compliance] ${task.name}`);
  const details = encodeURIComponent(`Form: ${task.form||''}\nPeriod: ${task.period||''}\nDue: ${formatDate(task.due)}\n${task.penaltyInfo ? 'Penalty: '+task.penaltyInfo : ''}`);
  const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${start}/${end}&details=${details}`;
  window.open(url, '_blank');
}

// ─── SMALL SHARED COMPONENTS ─────────────────────────────────────────────────

function CategoryTag({ cat, size='sm' }) {
  const c = getCatInfo(cat);
  return <span className="cat-label" style={{ background:c.bg, color:c.color, fontSize:size==='xs'?9.5:11 }}>{c.label}</span>;
}
function DueBadge({ due }) {
  const d = getDueDays(due); const s = getDueStatus(due);
  const label = s==='overdue'?`${Math.abs(d)}d overdue`:s==='today'?'Due Today':s==='soon'?`${d}d left`:formatDate(due);
  return <span className={`due-badge due-${s}`}>{label}</span>;
}

// ─── COMPLIANCE TILE ─────────────────────────────────────────────────────────

function ComplianceTile({ cat, tasks, fy, onNavigate }) {
  const meta = TILE_META[cat] || {};
  const c = getCatInfo(cat);
  const catTasks = tasks.filter(t => t.cat === cat && (!fy || t.fy === fy));
  if (catTasks.length === 0) return null;
  const done = catTasks.filter(t => t.status === 'done').length;
  const overdue = catTasks.filter(t => t.status !== 'done' && getDueStatus(t.due) === 'overdue').length;
  const pending = catTasks.length - done;
  const pct = catTasks.length ? Math.round(done/catTasks.length*100) : 0;
  const next = catTasks.filter(t => t.status !== 'done').sort((a,b) => new Date(a.due)-new Date(b.due))[0];
  return (
    <div onClick={() => onNavigate('tasks')} style={{ background:'var(--card)', borderRadius:18, border:'1px solid var(--border)', overflow:'hidden', cursor:'pointer', transition:'all .25s', boxShadow:'var(--shadow)' }}
      onMouseEnter={e=>{e.currentTarget.style.transform='translateY(-4px)';e.currentTarget.style.borderColor=c.color;e.currentTarget.style.boxShadow=`0 8px 28px ${c.color}30`;}}
      onMouseLeave={e=>{e.currentTarget.style.transform='';e.currentTarget.style.borderColor='var(--border)';e.currentTarget.style.boxShadow='var(--shadow)';}}>
      <div style={{ background:meta.grad, padding:'15px 17px 13px', position:'relative', overflow:'hidden' }}>
        <div style={{ position:'absolute', right:-16, top:-16, width:74, height:74, borderRadius:'50%', background:'rgba(255,255,255,.1)' }}/>
        <div style={{ position:'absolute', right:14, top:18, fontSize:30, opacity:.9 }}>{meta.icon}</div>
        <div style={{ fontSize:9.5, fontWeight:800, textTransform:'uppercase', letterSpacing:'1px', color:'rgba(255,255,255,.7)', marginBottom:2 }}>Compliance</div>
        <div style={{ fontSize:19, fontWeight:900, color:'#fff', lineHeight:1 }}>{c.label}</div>
        <div style={{ fontSize:9.5, color:'rgba(255,255,255,.6)', marginTop:3 }}>{meta.forms}</div>
      </div>
      <div style={{ padding:'13px 16px 15px' }}>
        <div style={{ display:'flex', gap:7, marginBottom:11 }}>
          {[{n:overdue,l:'OVERDUE',col:overdue>0?'var(--accent3)':'var(--text)'},{n:pending,l:'PENDING',col:'var(--accent2)'},{n:done,l:'DONE',col:'var(--accent)'}].map(s=>(
            <div key={s.l} style={{ flex:1, textAlign:'center', background:'rgba(255,255,255,.04)', borderRadius:9, padding:'7px 3px' }}>
              <div style={{ fontSize:19, fontWeight:800, color:s.col }}>{s.n}</div>
              <div style={{ fontSize:9, color:'var(--text3)', fontWeight:600, marginTop:1 }}>{s.l}</div>
            </div>
          ))}
        </div>
        <div style={{ marginBottom:9 }}>
          <div style={{ display:'flex', justifyContent:'space-between', marginBottom:3 }}>
            <span style={{ fontSize:10.5, color:'var(--text2)' }}>Progress</span>
            <span style={{ fontSize:10.5, fontWeight:700, color:c.color }}>{pct}%</span>
          </div>
          <div style={{ height:5, background:'rgba(255,255,255,.07)', borderRadius:3, overflow:'hidden' }}>
            <div style={{ height:'100%', width:`${pct}%`, background:meta.grad, borderRadius:3, transition:'width .5s ease' }}/>
          </div>
        </div>
        {next ? (
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', background:'rgba(255,255,255,.04)', borderRadius:7, padding:'6px 9px' }}>
            <div style={{ minWidth:0 }}>
              <div style={{ fontSize:9.5, color:'var(--text3)', fontWeight:600, marginBottom:1 }}>NEXT DUE</div>
              <div style={{ fontSize:10.5, color:'var(--text)', fontWeight:600, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', maxWidth:130 }}>{next.name.replace(/\(.*\)/,'').trim()}</div>
            </div>
            <DueBadge due={next.due} />
          </div>
        ) : (
          <div style={{ textAlign:'center', fontSize:12, color:'var(--accent)', fontWeight:700, padding:'5px 0' }}>🎉 All Clear!</div>
        )}
        <div style={{ marginTop:7, fontSize:9.5, color:'var(--text3)', display:'flex', gap:3 }}><span>⚠️</span><span>{meta.penalty}</span></div>
      </div>
    </div>
  );

// ─── CALENDAR ────────────────────────────────────────────────────────────────

function CalendarView({ tasks, onUpdateTasks, aiCfg }) {
  const [viewYear, setViewYear] = useState(() => today().getFullYear());
  const [viewMonth, setViewMonth] = useState(() => today().getMonth());
  const [selectedDay, setSelectedDay] = useState(null);
  const [catFilter, setCatFilter] = useState('all');
  const [editTask, setEditTask] = useState(null);
  const [editForm, setEditForm] = useState({});

  const prevMonth = () => { if (viewMonth===0){setViewYear(y=>y-1);setViewMonth(11);}else setViewMonth(m=>m-1); };
  const nextMonth = () => { if (viewMonth===11){setViewYear(y=>y+1);setViewMonth(0);}else setViewMonth(m=>m+1); };

  const tasksByDay = useMemo(() => {
    const map = {};
    tasks.filter(t => catFilter==='all' || t.cat===catFilter).forEach(t => {
      if (!t.due) return;
      const d = new Date(t.due);
      if (d.getFullYear()===viewYear && d.getMonth()===viewMonth) {
        const k = d.getDate(); if (!map[k]) map[k]=[];
        map[k].push(t);
      }
    });
    return map;
  }, [tasks, viewYear, viewMonth, catFilter]);

  const firstDay = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  const prevDays = new Date(viewYear, viewMonth, 0).getDate();
  const todayObj = today();
  const cells = [];
  for (let i=0;i<firstDay;i++) cells.push({day:prevDays-firstDay+i+1,other:true});
  for (let i=1;i<=daysInMonth;i++) cells.push({day:i,other:false});
  while (cells.length%7!==0) cells.push({day:cells.length-firstDay-daysInMonth+1,other:true});

  const openEdit = (t) => { setEditTask(t); setEditForm({status:t.status, notes:t.notes||'', due:t.due}); };
  const saveEdit = () => {
    onUpdateTasks(tasks.map(t => t.id===editTask.id ? {...t, ...editForm} : t));
    setEditTask(null);
  };

  const selectedTasks = selectedDay ? (tasksByDay[selectedDay]||[]) : [];

  return (
    <div className="page fade-in">
      <div className="card" style={{ marginBottom:18 }}>
        <div className="card-header">
          <div className="month-nav">
            <button className="month-nav-btn" onClick={prevMonth}>◀</button>
            <div className="month-name">{MONTHS[viewMonth]} {viewYear}</div>
            <button className="month-nav-btn" onClick={nextMonth}>▶</button>
          </div>
          <div style={{ display:'flex', gap:7, alignItems:'center', flexWrap:'wrap' }}>
            <div className="fy-badge">FY 2025-26 / 2026-27</div>
            <button className="btn btn-secondary btn-sm" onClick={()=>{const n=today();setViewYear(n.getFullYear());setViewMonth(n.getMonth());}}>Today</button>
          </div>
        </div>
        <div className="filter-row">
          <div className={`filter-pill ${catFilter==='all'?'active':''}`} onClick={()=>setCatFilter('all')}>All</div>
          {COMP_CATEGORIES.map(c=>(
            <div key={c.id} className={`filter-pill ${catFilter===c.id?'active':''}`}
              style={catFilter===c.id?{borderColor:c.color,color:c.color,background:c.bg}:{}}
              onClick={()=>setCatFilter(c.id)}>{c.label}</div>
          ))}
        </div>
        <div style={{ display:'flex', gap:10, flexWrap:'wrap', marginBottom:14 }}>
          {COMP_CATEGORIES.map(c=>(
            <div key={c.id} style={{ display:'flex', alignItems:'center', gap:3, fontSize:10.5, color:'var(--text2)' }}>
              <div style={{ width:7, height:7, borderRadius:2, background:c.color }}/>
              {c.label}
            </div>
          ))}
        </div>
        <div className="calendar-grid">
          {DAYS.map(d=><div key={d} className="cal-day-header">{d}</div>)}
          {cells.map((cell,i)=>{
            const isToday = !cell.other && cell.day===todayObj.getDate() && viewMonth===todayObj.getMonth() && viewYear===todayObj.getFullYear();
            const dayTasks = cell.other?[]:(tasksByDay[cell.day]||[]);
            const isSelected = !cell.other && selectedDay===cell.day;
            return (
              <div key={i} className={`cal-day ${isToday?'today':''} ${cell.other?'other-month':''}`}
                style={isSelected?{border:'2px solid var(--secondary)',background:'rgba(124,58,237,.1)'}:{}}
                onClick={()=>!cell.other&&setSelectedDay(cell.day===selectedDay?null:cell.day)}>
                <div className="day-num">{cell.day}</div>
                {dayTasks.slice(0,3).map(t=>{
                  const c=getCatInfo(t.cat);
                  return <div key={t.id} className="cal-event" style={{ background:c.bg, color:c.color, border:`1px solid ${c.color}30`, textDecoration:t.status==='done'?'line-through':'none' }} title={t.name}>
                    {t.name.replace(/\(.*\)/,'').trim().slice(0,17)}
                  </div>;
                })}
                {dayTasks.length>3&&<div className="cal-more">+{dayTasks.length-3} more</div>}
              </div>
            );
          })}
        </div>
      </div>

      {/* Selected Day Panel */}
      {selectedDay && (
        <div className="card fade-in">
          <div className="card-header">
            <div className="card-title">📌 {selectedDay} {SHORT_MONTHS[viewMonth]} {viewYear} — Compliance Due</div>
            <button className="btn btn-ghost btn-sm" onClick={()=>setSelectedDay(null)}>✕ Close</button>
          </div>
          {aiCfg && selectedTasks.length>0 && (
            <AIInsight aiCfg={aiCfg} compact
              label={`🤖 Priorities for ${selectedDay} ${SHORT_MONTHS[viewMonth]}`}
              buttonText="Suggest Order of Action"
              cacheKey={`day_${viewYear}_${viewMonth}_${selectedDay}`}
              prompt={`On ${selectedDay} ${SHORT_MONTHS[viewMonth]} ${viewYear}, these Indian compliances are due: ${selectedTasks.map(t=>`${t.name} (${t.form||''})`).join('; ')}. Recommend the optimal order of action for the day, data/logins to have ready for each, and any filings that can be batched together.`}/>
          )}
          {selectedTasks.length===0 ? (
            <div style={{ color:'var(--text2)', fontSize:13, padding:'10px 0', textAlign:'center' }}>✅ No compliance due on this date.</div>
          ) : selectedTasks.map(t=>{
            const c = getCatInfo(t.cat);
            return (
              <div key={t.id} style={{ padding:'13px', background:'var(--dark2)', borderRadius:11, marginBottom:8, border:`1px solid ${c.color}30` }}>
                <div style={{ display:'flex', alignItems:'center', gap:7, marginBottom:7, flexWrap:'wrap' }}>
                  <CategoryTag cat={t.cat}/>
                  <span style={{ fontWeight:700, fontSize:13.5, flex:1 }}>{t.name}</span>
                  <span className={`due-badge due-${t.status==='done'?'upcoming':getDueStatus(t.due)}`} style={t.status==='done'?{background:'rgba(16,185,129,.15)',color:'var(--accent)'}:{}}>{t.status==='done'?'✅ Done':formatDate(t.due)}</span>
                </div>
                {t.desc&&<div style={{ fontSize:11.5, color:'var(--text2)', marginBottom:6 }}>{t.desc}</div>}
                {t.notes&&<div style={{ fontSize:11, color:'var(--accent2)', background:'rgba(245,158,11,.08)', borderRadius:6, padding:'4px 8px', marginBottom:6 }}>📝 {t.notes}</div>}
                <div style={{ display:'flex', gap:10, fontSize:11.5, color:'var(--text3)', flexWrap:'wrap', marginBottom:8 }}>
                  {t.form&&<span>📝 {t.form}</span>}
                  {t.period&&<span>📅 {t.period}</span>}
                  {t.penaltyInfo&&<span style={{ color:'#FCA5A5' }}>⚠️ {t.penaltyInfo}</span>}
                </div>
                <div style={{ display:'flex', gap:7, flexWrap:'wrap' }}>
                  <button className="btn btn-sm" style={{ background:t.status==='done'?'rgba(255,255,255,.06)':'rgba(16,185,129,.14)', color:t.status==='done'?'var(--text2)':'var(--accent)', border:`1px solid ${t.status==='done'?'var(--border)':'rgba(16,185,129,.28)'}` }}
                    onClick={()=>onUpdateTasks(tasks.map(x=>x.id===t.id?{...x,status:x.status==='done'?'pending':'done'}:x))}>
                    {t.status==='done'?'↩️ Mark Pending':'✅ Mark Done'}
                  </button>
                  <button className="btn btn-secondary btn-sm" onClick={()=>openEdit(t)}>✏️ Edit / Notes</button>
                  <button className="btn btn-gcal btn-sm" onClick={()=>openGCal(t)} title="Add to Google Calendar">📅 Add to Google Calendar</button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* Edit Modal */}
      {editTask && (
        <div className="modal-overlay" onClick={()=>setEditTask(null)}>
          <div className="modal fade-in" onClick={e=>e.stopPropagation()}>
            <div className="modal-header">
              <div>
                <div className="modal-title">✏️ Edit Compliance</div>
                <div style={{ fontSize:12, color:'var(--text2)', marginTop:4 }}>{editTask.name}</div>
              </div>
              <button className="close-btn" onClick={()=>setEditTask(null)}>✕</button>
            </div>
            <div className="modal-body">
              <div className="form-grid">
                <div className="form-group">
                  <label>Status</label>
                  <select value={editForm.status} onChange={e=>setEditForm(f=>({...f,status:e.target.value}))}>
                    <option value="pending">⏳ Pending</option>
                    <option value="done">✅ Done</option>
                    <option value="inprogress">🔄 In Progress</option>
                    <option value="na">➖ N/A</option>
                  </select>
                </div>
                <div className="form-group">
                  <label>Due Date (Override)</label>
                  <input type="date" value={editForm.due} onChange={e=>setEditForm(f=>({...f,due:e.target.value}))}/>
                </div>
                <div className="form-group full">
                  <label>Notes / Remarks</label>
                  <textarea rows={3} value={editForm.notes} onChange={e=>setEditForm(f=>({...f,notes:e.target.value}))} placeholder="Add notes, reference numbers, filed by whom..."/>
                </div>
              </div>
              <div style={{ marginTop:12 }}>
                <button className="btn btn-gcal" onClick={()=>openGCal({...editTask,...editForm})} style={{ width:'100%', justifyContent:'center' }}>
                  📅 Add to Google Calendar
                </button>
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-secondary" onClick={()=>setEditTask(null)}>Cancel</button>
              <button className="btn btn-primary" onClick={saveEdit}>💾 Save Changes</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── TASKS ───────────────────────────────────────────────────────────────────

function TasksView({ tasks, onUpdate, aiCfg }) {
  const [filter, setFilter] = useState('pending');
  const [catFilter, setCatFilter] = useState('all');
  const [search, setSearch] = useState('');
  const [selectedTask, setSelectedTask] = useState(null);
  const [editForm, setEditForm] = useState({});

  const filtered = useMemo(() => {
    let t = tasks;
    if (filter==='pending') t=t.filter(x=>x.status!=='done');
    else if (filter==='done') t=t.filter(x=>x.status==='done');
    else if (filter==='overdue') t=t.filter(x=>x.status!=='done'&&getDueStatus(x.due)==='overdue');
    if (catFilter!=='all') t=t.filter(x=>x.cat===catFilter);
    if (search) t=t.filter(x=>x.name.toLowerCase().includes(search.toLowerCase())||(x.form||'').toLowerCase().includes(search.toLowerCase()));
    return t.sort((a,b)=>new Date(a.due)-new Date(b.due));
  }, [tasks,filter,catFilter,search]);

  const counts = useMemo(()=>({
    all:tasks.length, pending:tasks.filter(t=>t.status!=='done').length,
    done:tasks.filter(t=>t.status==='done').length,
    overdue:tasks.filter(t=>t.status!=='done'&&getDueStatus(t.due)==='overdue').length,
  }),[tasks]);

  const toggleStatus = id => onUpdate(tasks.map(t=>t.id===id?{...t,status:t.status==='done'?'pending':'done'}:t));

  const openDetail = t => { setSelectedTask(t); setEditForm({status:t.status,notes:t.notes||'',due:t.due}); };
  const saveDetail = () => {
    onUpdate(tasks.map(t=>t.id===selectedTask.id?{...t,...editForm}:t));
    setSelectedTask(null);
  };

  return (
    <div className="page fade-in">
      <div className="card" style={{ marginBottom:18 }}>
        <div style={{ display:'flex', gap:7, flexWrap:'wrap', marginBottom:11 }}>
          {[{id:'all',l:`All (${counts.all})`},{id:'pending',l:`Pending (${counts.pending})`},{id:'overdue',l:`⚠️ Overdue (${counts.overdue})`},{id:'done',l:`✅ Done (${counts.done})`}].map(f=>(
            <button key={f.id} className={`tab ${filter===f.id?'active':''}`} style={{ padding:'6px 15px', fontSize:12 }} onClick={()=>setFilter(f.id)}>{f.l}</button>
          ))}
        </div>
        <div style={{ display:'flex', gap:9, flexWrap:'wrap' }}>
          <div className="search-bar" style={{ flex:1, minWidth:180 }}>
            <span className="search-icon">🔍</span>
            <input placeholder="Search compliance..." value={search} onChange={e=>setSearch(e.target.value)}/>
          </div>
          <select value={catFilter} onChange={e=>setCatFilter(e.target.value)} style={{ width:'auto', minWidth:140 }}>
            <option value="all">All Categories</option>
            {COMP_CATEGORIES.map(c=><option key={c.id} value={c.id}>{c.label}</option>)}
          </select>
        </div>
      </div>
      <div className="card">
        <div className="card-header">
          <div className="card-title">📋 Compliance Tasks — {filtered.length} items</div>
          <div style={{ display:'flex', gap:7 }}>
            <button className="btn btn-success btn-sm" onClick={()=>onUpdate(tasks.map(t=>filtered.find(f=>f.id===t.id)?{...t,status:'done'}:t))}>✅ Mark All Done</button>
            <button className="btn btn-secondary btn-sm" onClick={()=>onUpdate(tasks.map(t=>filtered.find(f=>f.id===t.id)?{...t,status:'pending'}:t))}>↩️ Reset All</button>
          </div>
        </div>
        <div style={{ maxHeight:560, overflowY:'auto', paddingRight:3 }}>
          {filtered.length===0 ? (
            <div style={{ textAlign:'center', color:'var(--text2)', padding:'38px 0' }}>
              <div style={{ fontSize:34, marginBottom:8 }}>🎯</div>No tasks match this filter.
            </div>
          ) : filtered.map(t=>{
            const c=getCatInfo(t.cat);
            return (
              <div key={t.id} className={`task-item ${t.status==='done'?'done':''}`} style={{ borderLeft:`3px solid ${c.color}` }}>
                <div className={`task-checkbox ${t.status==='done'?'checked':''}`} onClick={()=>toggleStatus(t.id)} style={{ cursor:'pointer', borderColor:t.status==='done'?'var(--accent)':c.color }}>
                  {t.status==='done'&&<span style={{ color:'#fff', fontSize:9 }}>✓</span>}
                </div>
                <div style={{ flex:1, minWidth:0 }} onClick={()=>openDetail(t)}>
                  <div style={{ display:'flex', alignItems:'center', gap:5, flexWrap:'wrap' }}>
                    <span className="task-name" style={{ textDecoration:t.status==='done'?'line-through':'none' }}>{t.name}</span>
                    <CategoryTag cat={t.cat} size="xs"/>
                    {t.form&&<span style={{ fontSize:9.5, color:'var(--text3)', background:'rgba(255,255,255,.05)', padding:'1px 5px', borderRadius:4 }}>{t.form}</span>}
                    {t.fy&&<span style={{ fontSize:9.5, color:'var(--text3)', background:'rgba(255,255,255,.05)', padding:'1px 5px', borderRadius:4 }}>FY {t.fy}</span>}
                  </div>
                  {t.desc&&<div style={{ fontSize:10.5, color:'var(--text2)', marginTop:2 }}>{t.desc}</div>}
                  {t.notes&&<div style={{ fontSize:10, color:'var(--accent2)', marginTop:2 }}>📝 {t.notes}</div>}
                  <div className="task-meta"><span>📅 {formatDate(t.due)}</span>{t.period&&<span>· {t.period}</span>}</div>
                </div>
                {t.status!=='done'&&<DueBadge due={t.due}/>}
                {t.status==='done'&&<span className="due-badge" style={{ background:'rgba(16,185,129,.15)', color:'var(--accent)' }}>✅ Done</span>}
              </div>
            );
          })}
        </div>
      </div>

      {/* Task Detail Modal */}
      {selectedTask && (
        <div className="modal-overlay" onClick={()=>setSelectedTask(null)}>
          <div className="modal fade-in" onClick={e=>e.stopPropagation()}>
            <div className="modal-header">
              <div>
                <div className="modal-title">{selectedTask.name}</div>
                <div style={{ display:'flex', gap:5, marginTop:5 }}>
                  <CategoryTag cat={selectedTask.cat}/>
                  {selectedTask.form&&<span style={{ fontSize:10.5, background:'rgba(255,255,255,.08)', padding:'2px 7px', borderRadius:5, color:'var(--text2)' }}>{selectedTask.form}</span>}
                </div>
              </div>
              <button className="close-btn" onClick={()=>setSelectedTask(null)}>✕</button>
            </div>
            <div className="modal-body">
              {selectedTask.desc&&<div className="alert alert-info" style={{ marginBottom:14 }}><span>ℹ️</span>{selectedTask.desc}</div>}
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginBottom:14 }}>
                {[
                  {l:'Due Date',v:formatDate(selectedTask.due)},{l:'Period',v:selectedTask.period||'—'},
                  {l:'FY',v:selectedTask.fy||'—'},{l:'Form',v:selectedTask.form||'—'},
                ].map(f=>(
                  <div key={f.l} style={{ background:'var(--dark)', borderRadius:9, padding:'10px 12px' }}>
                    <div style={{ fontSize:10, color:'var(--text3)', marginBottom:3 }}>{f.l.toUpperCase()}</div>
                    <div style={{ fontWeight:700, fontSize:13 }}>{f.v}</div>

                label="🤖 AI Guide for This Compliance"
                buttonText="Explain & Checklist"
                cacheKey={`task_${selectedTask.id}`}

              <div className="form-group" style={{ marginBottom:14 }}>

                <textarea rows={3} value={editForm.notes} onChange={e=>setEditForm(f=>({...f,notes:e.target.value}))} placeholder="Add reference numbers, filed by whom, challan details..."/>
              </div>
              <button className="btn btn-gcal" style={{ width:'100%', justifyContent:'center' }} onClick={()=>openGCal({...selectedTask,...editForm})}>

              </button>

// ─── AI INSIGHT COMPONENT ────────────────────────────────────────────────────

function AIInsight({ aiCfg, label='🤖 AI Insight', buttonText='Generate AI Insight', prompt, cacheKey, compact=false }) {
  const [state, setState] = useState(() => cacheKey ? loadPersist('aicache_'+cacheKey, { text:'', when:null }) : { text:'', when:null });
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const provider = aiCfg?.provider;
  const apiKey = aiCfg?.keys?.[provider];
  const ready = !!(provider && apiKey);

  const run = async () => {
    if (!ready) { setError('Configure AI in Profile → AI Settings first.'); return; }
    setLoading(true); setError('');
    try {
      const text = await aiGenerate({ provider, apiKey, prompt });
      const fresh = { text, when: new Date().toISOString(), provider };
      setState(fresh);
      if (cacheKey) savePersist('aicache_'+cacheKey, fresh);
    } catch(e) { setError(e.message || 'AI call failed'); }
    finally { setLoading(false); }
  };

  const pLabel = provider ? AI_MODELS[provider]?.label : 'No provider';
  return (
    <div style={{ background:'linear-gradient(135deg,rgba(124,58,237,.08),rgba(255,107,53,.06))', border:'1px solid rgba(124,58,237,.25)', borderRadius:11, padding: compact?'10px 12px':'13px 15px', marginBottom: compact?10:14 }}>
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:8, marginBottom: state.text||error?9:0, flexWrap:'wrap' }}>
        <div style={{ fontSize:12, fontWeight:700, color:'var(--secondary)', display:'flex', alignItems:'center', gap:6 }}>
          <span>{label}</span>
          <span style={{ fontSize:9.5, color:'var(--text3)', fontWeight:600 }}>· {pLabel}</span>
        </div>
        <button className="btn btn-sm" onClick={run} disabled={loading||!ready} style={{ background:'linear-gradient(135deg,var(--secondary),var(--primary))', color:'#fff', fontSize:11, padding:'5px 12px' }}>
          {loading ? '⏳ Thinking…' : (state.text ? '🔄 Regenerate' : buttonText)}
        </button>
      </div>
      {error && <div style={{ fontSize:11, color:'var(--accent3)', marginTop:6 }}>⚠️ {error}</div>}
      {state.text && (
        <div style={{ fontSize:12, color:'var(--text)', lineHeight:1.65, whiteSpace:'pre-wrap', marginTop:4 }}>
          {state.text}
          <div style={{ fontSize:9.5, color:'var(--text3)', marginTop:6 }}>Generated {state.when ? new Date(state.when).toLocaleString('en-IN') : ''} · Verify with your CA/CS.</div>
        </div>
      )}
      {!state.text && !error && !loading && !ready && (
        <div style={{ fontSize:10.5, color:'var(--text3)', marginTop:6 }}>Add an AI API key in Profile → AI Settings to enable insights.</div>
      )}
    </div>
  );
}

// ─── DATA MANAGEMENT ─────────────────────────────────────────────────────────

function DataView({ profile, tasks, onImport, onReset }) {
  const [msg, setMsg] = useState('');
  const [confirmReset, setConfirmReset] = useState(false);

  const exportData = () => {
    const data = { _version:STORAGE_VERSION, exportedAt:new Date().toISOString(), profile, tasks };
    const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`vtcp-backup-${new Date().toISOString().slice(0,10)}.json`; a.click();
    setMsg('✅ Exported successfully!');
  };
  const handleImport = e => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ev => { try { const d=JSON.parse(ev.target.result); if(d.profile&&d.tasks){onImport(d);setMsg('✅ Imported!');}else setMsg('❌ Invalid file.'); } catch{setMsg('❌ Parse error.');} };
    r.readAsText(f);
  };
  const done = tasks.filter(t=>t.status==='done').length;

  return (
    <div className="page fade-in">
      {msg&&<div className={`alert ${msg.startsWith('✅')?'alert-success':'alert-danger'} fade-in`} style={{ marginBottom:14 }}><span/>{msg.replace(/^[✅❌]\s*/,'')}</div>}
      <div className="section-grid">
        <div>
          <div className="card" style={{ marginBottom:18 }}>
            <div className="card-title" style={{ marginBottom:13 }}>💾 Export Data</div>
            <div style={{ fontSize:13, color:'var(--text2)', lineHeight:1.65, marginBottom:14 }}>Export your complete profile, compliance status and portal list as a JSON backup.</div>
            <div style={{ background:'var(--dark2)', borderRadius:11, padding:14, marginBottom:14 }}>
              {[{l:'Profile',v:profile.name||'Unnamed'},{l:'Entity',v:ENTITY_TYPES.find(e=>e.id===profile.entityType)?.name||'—'},{l:'Total Tasks',v:tasks.length},{l:'Completed',v:done},{l:'Storage Version',v:STORAGE_VERSION}].map(r=>(
                <div key={r.l} className="summary-row"><span style={{ color:'var(--text2)', fontSize:12.5 }}>{r.l}</span><span style={{ fontWeight:700, fontSize:12.5 }}>{r.v}</span></div>
              ))}
            </div>
            <button className="btn btn-primary" style={{ width:'100%' }} onClick={exportData}>⬇️ Export as JSON Backup</button>
          </div>
          <div className="card">
            <div className="card-title" style={{ marginBottom:13 }}>⬆️ Import Data</div>
            <div style={{ fontSize:13, color:'var(--text2)', lineHeight:1.65, marginBottom:14 }}>Import a VTCP JSON backup. This overwrites current data.</div>
            <div className="drop-zone" onClick={()=>document.getElementById('import-file').click()}>
              <div style={{ fontSize:34, marginBottom:10 }}>📂</div>
              <div style={{ fontSize:13, color:'var(--text2)' }}>Click to select JSON backup file</div>
              <div style={{ fontSize:11, color:'var(--text3)', marginTop:5 }}>Accepts .json files exported from this app</div>
            </div>
            <input id="import-file" type="file" accept=".json" style={{ display:'none' }} onChange={handleImport}/>
          </div>
        </div>
        <div>
          <div className="card" style={{ marginBottom:16 }}>
            <div className="card-title" style={{ marginBottom:13, color:'var(--accent3)' }}>🗑️ Danger Zone</div>
            <div className="alert alert-danger" style={{ marginBottom:14 }}>⚠️ This will reset all compliance statuses to Pending. Profile is retained.</div>
            {!confirmReset ? (
              <button className="btn btn-danger" style={{ width:'100%' }} onClick={()=>setConfirmReset(true)}>🗑️ Reset All Compliance Status</button>
            ) : (
              <div>
                <div style={{ fontSize:12.5, color:'var(--accent3)', marginBottom:9, textAlign:'center' }}>Are you sure? Cannot be undone.</div>
                <div style={{ display:'flex', gap:7 }}>
                  <button className="btn btn-danger" style={{ flex:1 }} onClick={()=>{onReset();setConfirmReset(false);setMsg('✅ Reset done!');}}>Confirm</button>
                  <button className="btn btn-secondary" style={{ flex:1 }} onClick={()=>setConfirmReset(false)}>Cancel</button>
                </div>
              </div>
            )}
          </div>
          <div className="card">
            <div className="card-title" style={{ marginBottom:13 }}>📊 Data Summary</div>
            {COMP_CATEGORIES.map(c=>{
              const ct=tasks.filter(t=>t.cat===c.id);
              if(!ct.length) return null;
              return <div key={c.id} className="summary-row"><div style={{ display:'flex', alignItems:'center', gap:5 }}><div style={{ width:7, height:7, borderRadius:2, background:c.color }}/><span style={{ fontSize:12.5, color:c.color, fontWeight:600 }}>{c.label}</span></div><span style={{ fontSize:11.5, color:'var(--text2)' }}>{ct.filter(t=>t.status==='done').length}/{ct.length} done</span></div>;
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {

  const [onboarded, setOnboarded] = useState(() => loadPersist('onboarded', true));
  const [profile, setProfile] = useState(() => loadPersist('profile', DEFAULT_PROFILE));
  const [tasks, setTasks] = useState(() => loadPersist('tasks', null));
  const [portals, setPortals] = useState(() => loadPersist('portals', PORTAL_DEFAULTS));
  const [activePage, setActivePage] = useState('dashboard');

  // Google Drive sync state
  const [gUser, setGUser] = useState(() => loadPersist('guser', null));
  const [gClientId, setGClientId] = useState(() => loadPersist('gclient', ''));
  const [syncMode, setSyncMode] = useState(() => loadPersist('syncmode', 'off'));
  const [syncStatus, setSyncStatus] = useState({ state:'idle', last: loadPersist('synclast', null), error:null });
  const didInitialPull = useRef(false);

  // AI config
  const [aiCfg, setAiCfg] = useState(() => loadPersist('aicfg', { provider:'groq', keys:{} }));
  useEffect(() => { savePersist('aicfg', aiCfg); }, [aiCfg]);

  // Apply theme to body
  useEffect(() => {
    document.body.className = theme === 'light' ? 'light' : '';
    savePersist('theme', theme);
  }, [theme]);

  const generateTasks = useCallback((prof) => {
    const all = generateCompliances(prof.entityType);
    return all.filter(c => {
      if (c.cat==='gst'  && !prof.hasGST)    return false;
      if (c.cat==='tds'  && !prof.hasTDS)    return false;
      if (c.cat==='pf'   && !prof.hasPF)     return false;
      if (c.cat==='esic' && !prof.hasESIC)   return false;
      if (c.cat==='pt'   && !prof.hasPT)     return false;
      if (c.cat==='it'   && !prof.hasAdvTax) return false;
      if (c.cat==='mca'  && !prof.hasMCA)    return false;
      if (c.cat==='fcra' && !prof.hasFCRA)   return false;
      if (c.cat==='sebi' && !prof.isSEBI)    return false;
      return true;
    }).map(c => ({ ...c, status:'pending', notes:'' }));
  }, []);

  useEffect(() => {
    if (onboarded && tasks === null) {
      const t = generateTasks(profile);
      setTasks(t); savePersist('tasks', t);
    }
  }, [onboarded]);

  useEffect(() => { savePersist('profile', profile); }, [profile]);
  useEffect(() => { if (tasks) savePersist('tasks', tasks); }, [tasks]);
  useEffect(() => { savePersist('portals', portals); }, [portals]);
  useEffect(() => { savePersist('guser', gUser); }, [gUser]);
  useEffect(() => { savePersist('gclient', gClientId); }, [gClientId]);
  useEffect(() => { savePersist('syncmode', syncMode); }, [syncMode]);

  const doPush = useCallback(async () => {
    if (!gUser) return;
    setSyncStatus(s => ({ ...s, state:'syncing', error:null }));
    try {
      await driveSync.pushState({ profile, tasks, portals });
      const now = new Date().toISOString();
      savePersist('synclast', now);
      setSyncStatus({ state:'synced', last: now, error:null });
    } catch(e) {
      setSyncStatus(s => ({ ...s, state:'error', error: e?.result?.error?.message || e?.message || 'Sync failed' }));
    }
  }, [gUser, profile, tasks, portals]);

  const doPull = useCallback(async () => {
    if (!gUser) return;
    setSyncStatus(s => ({ ...s, state:'syncing', error:null }));
    try {
      const data = await driveSync.pullState();
      if (data) {
        if (data.profile) setProfile(data.profile);
        if (data.tasks) setTasks(data.tasks);
        if (data.portals) setPortals(data.portals);
        const now = new Date().toISOString();
        savePersist('synclast', now);
        setSyncStatus({ state:'synced', last: now, error:null });
      } else {
        setSyncStatus(s => ({ ...s, state:'idle', error:'No backup found on Drive' }));
      }
    } catch(e) {
      setSyncStatus(s => ({ ...s, state:'error', error: e?.result?.error?.message || e?.message || 'Pull failed' }));
    }
  }, [gUser]);

  // Auto-sync: debounced push on state changes
  useEffect(() => {
    if (syncMode !== 'auto' || !gUser) return;
    const t = setTimeout(() => { doPush(); }, 3000);
    return () => clearTimeout(t);
  }, [profile, tasks, portals, syncMode, gUser, doPush]);

  // Pull once on load if signed in and sync enabled
  useEffect(() => {
    if (didInitialPull.current) return;
    if (gUser && syncMode !== 'off') {
      didInitialPull.current = true;
      doPull();
    }
  }, [gUser, syncMode, doPull]);

  const handleSignIn = async () => {
    setSyncStatus(s => ({ ...s, state:'syncing', error:null }));
    try {
      const user = await driveSync.signIn(gClientId);
      setGUser(user);
      if (syncMode === 'off') setSyncMode('manual');
      setSyncStatus(s => ({ ...s, state:'idle', error:null }));
    } catch(e) {
      setSyncStatus(s => ({ ...s, state:'error', error: e?.message || 'Sign-in failed' }));
    }
  };
  const handleSignOut = () => { driveSync.signOut(); setGUser(null); setSyncMode('off'); didInitialPull.current = false; };

  const syncProps = {
    gUser, gClientId, syncMode, syncStatus,
    onSignIn: handleSignIn, onSignOut: handleSignOut,
    onSetClientId: setGClientId, onSetMode: setSyncMode,
    onPushNow: doPush, onPullNow: doPull,
  };

  const handleOnboardComplete = prof => {
    setProfile(prof); savePersist('profile', prof);
    const t = generateTasks(prof); setTasks(t); savePersist('tasks', t);
    setOnboarded(true); savePersist('onboarded', true);
  };
  const handleProfileSave = prof => {
    setProfile(prof);
    const newList = generateTasks(prof);
    const oldMap = {}; (tasks||[]).forEach(t=>oldMap[t.id]=t.status);
    setTasks(newList.map(t=>({...t, status:oldMap[t.id]||'pending'})));
  };
  const handleImport = data => {
    setProfile(data.profile); setTasks(data.tasks);
    if (data.portals) setPortals(data.portals);
    setOnboarded(true); savePersist('onboarded', true);
  };
  const handleReset = () => setTasks(t => t ? t.map(x=>({...x,status:'pending'})) : t);

  const overdueCnt = useMemo(() => (tasks||[]).filter(t=>t.status!=='done'&&getDueStatus(t.due)==='overdue').length, [tasks]);

  if (!onboarded) return <Onboarding onComplete={handleOnboardComplete}/>;

  const pageInfo = PAGE_TITLES[activePage];
  const entity = ENTITY_TYPES.find(e=>e.id===profile.entityType);

  return (
    <div className="app-layout">
      {/* SIDEBAR */}
      <div className="sidebar">
        <div className="brand">
          <div className="brand-logo">⚖️</div>
          <div className="brand-name">Vipin's Tax &<br/>Compliance Pro</div>
          <div className="brand-tagline">FY 2025-26 / 2026-27</div>
        </div>
        <div className="nav-section">
          <div className="nav-label">Navigation</div>
          {NAV_ITEMS.map(item=>(
            <div key={item.id} className={`nav-item ${activePage===item.id?'active':''}`} onClick={()=>setActivePage(item.id)}>
              <div className="nav-icon">{item.icon}</div>
              {item.label}
              {item.id==='tasks' && overdueCnt>0 && <span className="nav-badge">{overdueCnt}</span>}
            </div>
          ))}
        </div>
        {profile.name && (
          <div className="sidebar-profile" onClick={()=>setActivePage('profile')}>
            <div className="profile-entity-badge">{entity?.icon} {entity?.name}</div>
            <div className="profile-name">{profile.name}</div>
            {profile.pan  && <div className="profile-pan">PAN: {profile.pan}</div>}
            {profile.gstin && <div className="profile-pan">GST: {profile.gstin}</div>}
          </div>
        )}
      </div>

      {/* MAIN */}
      <div className="main-content">
        <div className="topbar">
          <div>
            <div className="topbar-title">{pageInfo.title}</div>
            <div className="topbar-subtitle">{pageInfo.sub}</div>
          </div>
          <div className="topbar-actions">
            {/* Theme Toggle */}
            <div className="theme-toggle">
              <button className={`theme-btn ${theme==='dark'?'active':''}`} onClick={()=>setTheme('dark')} title="Dark Mode">🌙</button>
              <button className={`theme-btn ${theme==='light'?'active':''}`} onClick={()=>setTheme('light')} title="Light Mode">☀️</button>
            </div>
            <div className="fy-badge">FY 2025-26</div>
          </div>
        </div>

        {activePage==='dashboard' && <Dashboard profile={profile} tasks={tasks||[]} onNavigate={setActivePage} aiCfg={aiCfg}/>}
        {activePage==='calendar'  && <CalendarView tasks={tasks||[]} onUpdateTasks={setTasks} aiCfg={aiCfg}/>}
        {activePage==='tasks'     && <TasksView tasks={tasks||[]} onUpdate={setTasks} aiCfg={aiCfg}/>}
        {activePage==='portals'   && <PortalsView portals={portals} onSave={setPortals}/>}
        {activePage==='profile'   && <ProfileView profile={profile} onSave={handleProfileSave} syncProps={syncProps} aiCfg={aiCfg} onAiChange={setAiCfg}/>}
        {activePage==='data'      && <DataView profile={profile} tasks={tasks||[]} onImport={handleImport} onReset={handleReset}/>}
        {activePage==='about'     && <AboutView/>}

        <div style={{ padding:'11px 26px', borderTop:'1px solid var(--border)', display:'flex', justifyContent:'space-between', alignItems:'center', fontSize:10.5, color:'var(--text3)' }}>
          <span>©2025 Vipin's Tax & Compliance Pro · v2.0</span>
          <span>Data stored locally · Not professional legal advice</span>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
